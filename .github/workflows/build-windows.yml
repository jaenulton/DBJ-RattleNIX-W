name: Build DBJ RattleNIX Windows Standalone EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up MinGW GCC
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Compile C++ Modem Binaries (encode.exe & decode_stream.exe)
      run: |
        mkdir bin
        g++ -O3 -std=c++17 -march=x86-64 src/encode.cpp -o bin/encode.exe
        g++ -O3 -std=c++17 -march=x86-64 src/decode_stream.cpp -o bin/decode_stream.exe

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy sounddevice aiohttp pyinstaller

    - name: Build Standalone Executable with PyInstaller
      run: |
        pyinstaller --name="DBJ_RattleNIX" --onefile --windowed --add-data "web/static;web/static" --add-data "bin;bin" --add-data "morse_decoder.py;." rattlegram_win.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DBJ_RattleNIX-Windows-x64
        path: dist/DBJ_RattleNIX.exe
